name: Clearance UI integration
on:
  push:
    branches: [feature/phase3-clearance-visualization]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install cmake sfml
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug
      - name: Build PATHLAB
        run: cmake --build build-ci --target demo_2e --parallel 4
      - name: Build and run regressions
        run: |
          cmake --build build-ci --parallel 4
          ctest --test-dir build-ci --output-on-failure
